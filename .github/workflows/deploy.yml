name: Deploy CRA to GitHub Pages

on:
  push:
    branches:
      - main  # Cambia a master si tu rama principal se llama master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build de React ignorando warnings
      - name: Build React App
        run: CI=false npm run build

      # 5️⃣ Deploy a gh-pages usando Personal Access Token
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}  # Asegúrate de crear este secret en tu repo
          publish_dir: ./build
          publish_branch: gh-pages
